name: Compilar APK

# Se ejecuta solo cuando subes archivos, o a mano desde la pestaña Actions
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar el APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar el APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk salida/Alarma.apk
          ls -la salida

      - name: Guardar el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: Alarma-APK
          path: salida/Alarma.apk

      - name: Publicar el APK en Releases (enlace directo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Alarma APK (build ${{ github.run_number }})
          body: |
            APK listo para instalar en Android.
            Descarga Alarma.apk desde este teléfono y ábrelo para instalar.
          files: salida/Alarma.apk
