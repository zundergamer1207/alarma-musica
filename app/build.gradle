plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.oscarpolonio.alarma'
    compileSdk 34

    defaultConfig {
        applicationId "com.oscarpolonio.alarma"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        debug {
            // Firma clásica (v1) + moderna (v2/v3): máxima compatibilidad al instalar
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la clave de depuración para poder instalarlo directo
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
}
